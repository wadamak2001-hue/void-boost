name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Build Android
        run: |
          cd android
          chmod +x gradlew
          export JAVA_HOME=$JAVA_HOME_17_X64
          ./gradlew clean
          ./gradlew assembleDebug
